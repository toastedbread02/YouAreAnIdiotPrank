name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 python-vlc

      - name: Install VLC
        run: |
          winget install VideoLAN.VLC --silent --accept-package-agreements 
--accept-source-agreements

      - name: Build
        run: |
          pyinstaller --clean MyVisualDemo.spec

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyVisualDemo-Windows
          path: dist/MyVisualDemo.exe
